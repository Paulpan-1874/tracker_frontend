# 前端部署配置 (SPA 静态托管)
# 用法: 将本文件放入 nginx 的 conf.d/ 目录 (或在 nginx.conf 的 http 块中 include 本文件), 然后 nginx -s reload
# 独立监听 8088 端口, 不影响 nginx 上已有的其他服务; 如需换端口只改 listen 即可
server {
    listen 8088;
    server_name _;

    # 构建产物目录 (npm run build 后生成的 dist), 按实际部署路径修改
    root /www/tracker_frontend/dist;
    index index.html;

    # 静态资源缓存策略
    # HTML 文件每次检查是否更新 (避免缓存导致旧版本)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # JS/CSS 带哈希的文件：长期缓存 (30 天)，浏览器可以随意缓存
    location ~* \.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其他静态资源也长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退: 所有未匹配的路径都回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 可选: 如需用 nginx 反代 PocketBase/EMQX 避免浏览器直连, 取消下面注释
    # location /pb/ {
    #     proxy_pass http://149.88.75.117:8091/;
    # }
    # location /mqtt-ws {
    #     proxy_pass http://149.88.75.117:8083/mqtt;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 300s;
    # }
}
